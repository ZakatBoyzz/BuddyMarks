name: Build BuddyMarks

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build BuddyMarks
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: BuddyMarks-JAR
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
